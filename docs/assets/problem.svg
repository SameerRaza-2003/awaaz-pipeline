<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Global statistics on violence and harassment against women and the reporting gap">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A2421"/>
      <stop offset="1" stop-color="#17564D"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C2410C"/>
      <stop offset="1" stop-color="#EA7A4F"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B7791F"/>
      <stop offset="1" stop-color="#E0A84A"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17564D"/>
      <stop offset="1" stop-color="#4FA393"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0A2421" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="22" fill="#F7F5F0"/>
  <rect width="1200" height="110" rx="22" fill="url(#hdr)"/>
  <rect y="88" width="1200" height="22" fill="url(#hdr)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="48" y="48" fill="#9FE0D2" font-size="14" font-weight="700" letter-spacing="3">THE PROBLEM</text>
    <text x="48" y="84" fill="#FFFFFF" font-size="28" font-weight="700">A global crisis that mostly goes unreported and unanswered</text>

    <!-- stat cards -->
    <g filter="url(#sh)">
      <rect x="48" y="138" width="258" height="206" rx="16" fill="#FFFFFF"/>
      <rect x="320" y="138" width="258" height="206" rx="16" fill="#FFFFFF"/>
      <rect x="592" y="138" width="258" height="206" rx="16" fill="#FFFFFF"/>
      <rect x="864" y="138" width="288" height="206" rx="16" fill="#FFFFFF"/>
    </g>
    <rect x="48" y="138" width="6" height="206" rx="3" fill="#C2410C"/>
    <rect x="320" y="138" width="6" height="206" rx="3" fill="#B42318"/>
    <rect x="592" y="138" width="6" height="206" rx="3" fill="#B7791F"/>
    <rect x="864" y="138" width="6" height="206" rx="3" fill="#17564D"/>

    <text x="74" y="208" fill="#C2410C" font-size="52" font-weight="800" letter-spacing="-1">840M</text>
    <text x="74" y="240" fill="#15171A" font-size="15.5" font-weight="600">women, nearly 1 in 3 worldwide,</text>
    <text x="74" y="261" fill="#15171A" font-size="15.5" font-weight="600">have faced partner or sexual</text>
    <text x="74" y="282" fill="#15171A" font-size="15.5" font-weight="600">violence in their lifetime</text>
    <text x="74" y="322" fill="#6B7078" font-size="12.5">World Health Organization, 2025</text>

    <text x="346" y="208" fill="#B42318" font-size="52" font-weight="800" letter-spacing="-1">85,000</text>
    <text x="346" y="240" fill="#15171A" font-size="15.5" font-weight="600">women and girls killed</text>
    <text x="346" y="261" fill="#15171A" font-size="15.5" font-weight="600">intentionally in 2023; 60% by</text>
    <text x="346" y="282" fill="#15171A" font-size="15.5" font-weight="600">a partner or family member</text>
    <text x="346" y="322" fill="#6B7078" font-size="12.5">UNODC and UN Women, 2024</text>

    <text x="618" y="208" fill="#B7791F" font-size="52" font-weight="800" letter-spacing="-1">743M</text>
    <text x="618" y="240" fill="#15171A" font-size="15.5" font-weight="600">workers (22.8%) have faced</text>
    <text x="618" y="261" fill="#15171A" font-size="15.5" font-weight="600">violence or harassment</text>
    <text x="618" y="282" fill="#15171A" font-size="15.5" font-weight="600">at work</text>
    <text x="618" y="322" fill="#6B7078" font-size="12.5">ILO, LRF and Gallup, 2022</text>

    <text x="890" y="208" fill="#17564D" font-size="52" font-weight="800" letter-spacing="-1">316M</text>
    <text x="890" y="240" fill="#15171A" font-size="15.5" font-weight="600">women subjected to partner</text>
    <text x="890" y="261" fill="#15171A" font-size="15.5" font-weight="600">violence in the past 12 months</text>
    <text x="890" y="282" fill="#15171A" font-size="15.5" font-weight="600">alone, 11% of women aged 15+</text>
    <text x="890" y="322" fill="#6B7078" font-size="12.5">World Health Organization, 2025</text>

    <!-- reporting funnel -->
    <rect x="48" y="372" width="1104" height="236" rx="16" fill="#FFFFFF" filter="url(#sh)"/>
    <text x="76" y="410" fill="#9A3412" font-size="13" font-weight="700" letter-spacing="2.5">THE REPORTING GAP</text>
    <text x="76" y="436" fill="#15171A" font-size="19" font-weight="700">Out of every 100 women who experience violence</text>

    <rect x="76" y="458" width="620" height="34" rx="8" fill="url(#b1)"/>
    <text x="92" y="481" fill="#FFFFFF" font-size="15" font-weight="700">100 experience violence</text>

    <rect x="76" y="502" width="248" height="34" rx="8" fill="url(#b2)"/>
    <text x="92" y="525" fill="#FFFFFF" font-size="15" font-weight="700">Fewer than 40</text>
    <text x="338" y="525" fill="#3D4248" font-size="15" font-weight="600">seek help of any kind</text>

    <rect x="76" y="546" width="26" height="34" rx="8" fill="url(#b3)"/>
    <text x="116" y="569" fill="#15171A" font-size="15" font-weight="700">Fewer than 4</text>
    <text x="222" y="569" fill="#3D4248" font-size="15" font-weight="600">go to the police</text>

    <line x1="736" y1="452" x2="736" y2="584" stroke="#E0DBD2" stroke-width="1.5"/>
    <text x="764" y="470" fill="#B42318" font-size="36" font-weight="800">&lt; 55%</text>
    <text x="764" y="496" fill="#15171A" font-size="15" font-weight="600">of harassed workers ever told anyone.</text>
    <text x="764" y="518" fill="#3D4248" font-size="14">Top reasons for silence: it felt like</text>
    <text x="764" y="538" fill="#3D4248" font-size="14">"a waste of time" and fear for their reputation.</text>
    <text x="764" y="572" fill="#6B7078" font-size="12.5">UN Statistics Division, The World's Women 2015;</text>
    <text x="764" y="590" fill="#6B7078" font-size="12.5">ILO, Lloyd's Register Foundation, Gallup, 2022</text>
  </g>
</svg>
