  <rect x="642" y="378" width="26" height="26" rx="8" fill="#B7791F" fill-opacity="0.14"/>
  <circle cx="655" cy="391" r="4.5" fill="#B7791F"/>
  <text x="682" y="395" fill="#15171A" font-size="15" font-weight="700">Language and region</text>
  <text x="682" y="413" fill="#6B7078" font-size="12.5">Default country, phone format, geocoder</text>
  <rect x="642" y="428" width="26" height="26" rx="8" fill="#B7791F" fill-opacity="0.14"/>
  <circle cx="655" cy="441" r="4.5" fill="#B7791F"/>
  <text x="682" y="445" fill="#15171A" font-size="15" font-weight="700">Channels</text>
  <text x="682" y="463" fill="#6B7078" font-size="12.5">Twilio, local SIM via MacroDroid, Discord, email</text>
