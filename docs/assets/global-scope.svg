  <circle cx="655" cy="291" r="4.5" fill="#B7791F"/>
  <text x="682" y="295" fill="#15171A" font-size="15" font-weight="700">Communities and news organisations</text>
  <text x="682" y="313" fill="#6B7078" font-size="12.5">Tagged by country or GLOBAL</text>
  <rect x="642" y="328" width="26" height="26" rx="8" fill="#B7791F" fill-opacity="0.14"/>
  <circle cx="655" cy="341" r="4.5" fill="#B7791F"/>
  <text x="682" y="345" fill="#15171A" font-size="15" font-weight="700">Legal deadline</text>
