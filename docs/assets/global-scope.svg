  <text x="58" y="571" fill="#17564D" font-size="13" font-weight="800">SDG 5.2</text>
  <text x="123.39999999999999" y="571" fill="#3D4248" font-size="13">End violence against women and girls</text>
  <rect x="401.6" y="550" width="259.20000000000005" height="32" rx="16" fill="#FFFFFF" stroke="#D9D3C8"/>
  <text x="415.6" y="571" fill="#17564D" font-size="13" font-weight="800">SDG 16.3</text>
  <text x="489.20000000000005" y="571" fill="#3D4248" font-size="13">Equal access to justice</text>
  <rect x="672.8000000000001" y="550" width="381.6" height="32" rx="16" fill="#FFFFFF" stroke="#D9D3C8"/>
  <text x="686.8000000000001" y="571" fill="#17564D" font-size="13" font-weight="800">ILO C190</text>
  <text x="760.4000000000001" y="571" fill="#3D4248" font-size="13">Violence and Harassment Convention, 2019</text>
