  <path d="M68.5 191 l4 4 l7.5 -8" fill="none" stroke="#17564D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="102" y="195" fill="#15171A" font-size="15" font-weight="700">Eight AI agents</text>
  <text x="102" y="213" fill="#6B7078" font-size="12.5">Interview, drafting, matching, alerts, dispatch, status, email</text>
  <rect x="62" y="228" width="26" height="26" rx="8" fill="#17564D" fill-opacity="0.12"/>
  <path d="M68.5 241 l4 4 l7.5 -8" fill="none" stroke="#17564D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="102" y="245" fill="#15171A" font-size="15" font-weight="700">Privacy engine</text>
  <text x="102" y="263" fill="#6B7078" font-size="12.5">Scanner plus independent review, fails closed</text>
  <rect x="62" y="278" width="26" height="26" rx="8" fill="#17564D" fill-opacity="0.12"/>
  <path d="M68.5 291 l4 4 l7.5 -8" fill="none" stroke="#17564D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="102" y="295" fill="#15171A" font-size="15" font-weight="700">Outbound Guard</text>
  <text x="102" y="313" fill="#6B7078" font-size="12.5">Dry run, sandbox and live modes, no double sends</text>
  <rect x="62" y="328" width="26" height="26" rx="8" fill="#17564D" fill-opacity="0.12"/>
  <path d="M68.5 341 l4 4 l7.5 -8" fill="none" stroke="#17564D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
