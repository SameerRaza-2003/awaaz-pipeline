  <rect width="1200" height="96" rx="22" fill="url(#hdr)"/>
  <rect y="74" width="1200" height="22" fill="url(#hdr)"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <text x="44" y="42" fill="#9FE0D2" font-size="13.5" font-weight="700" letter-spacing="3">GLOBAL SCOPE</text>
  <text x="44" y="76" fill="#FFFFFF" font-size="26" font-weight="700">One core, deployable in any country</text>
  <rect x="40" y="122" width="540" height="380" rx="18" fill="#17564D" fill-opacity="0.06" stroke="#17564D" stroke-opacity="0.35" stroke-width="1.5"/>
