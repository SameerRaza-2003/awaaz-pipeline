  <rect x="62" y="378" width="26" height="26" rx="8" fill="#17564D" fill-opacity="0.12"/>
  <path d="M68.5 391 l4 4 l7.5 -8" fill="none" stroke="#17564D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
